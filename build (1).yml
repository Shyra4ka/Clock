name: Build mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORGE_VERSION: 1.20.1-47.3.0
  MOD_ID: timestopclock

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Forge MDK
        run: |
          curl -fsSL -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-mdk.zip"
          mkdir mdk
          unzip -q mdk.zip -d mdk

      - name: Insert mod sources into MDK
        run: |
          rm -rf mdk/src
          cp -r src mdk/src
          sed -i "s/^mod_id=.*/mod_id=${MOD_ID}/" mdk/gradle.properties
          sed -i "s/^mod_name=.*/mod_name=Time Stop Clock/" mdk/gradle.properties
          sed -i "s/^mod_group_id=.*/mod_group_id=com.example.timestopclock/" mdk/gradle.properties
          sed -i "s/^mod_version=.*/mod_version=1.0.0/" mdk/gradle.properties
          chmod +x mdk/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ env.FORGE_VERSION }}-${{ hashFiles('src/**') }}
          restore-keys: gradle-${{ env.FORGE_VERSION }}-

      - name: Build
        working-directory: mdk
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: timestopclock-jar
          path: mdk/build/libs/*.jar

      - name: Attach jar to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mdk/build/libs/*.jar
